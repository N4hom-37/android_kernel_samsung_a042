name: Kernel Builder v3

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag'
        required: true
        default: 'v1.0.0'
        type: string
      publish_release:
        description: 'Publish release'
        required: true
        default: false
        type: boolean
      latest_submodules:
        description: 'Update submodule'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      KBUILD_BUILD_USER: "N4hom"
      KBUILD_BUILD_HOST: "GitHub"
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      RDIR: ${{ github.workspace }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      NEUTRON_CLANG_URL: https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update || exit 1
          sudo apt install -y \
            device-tree-compiler zlib1g-dev bc cpio kmod \
            libelf-dev pahole || exit 1

          mkdir -p /tmp/libtinfo5
          NCURSES_POOL="http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses"
          LIBTINFO5_DEB=$(curl -fsL "${NCURSES_POOL}/" \
            | grep -oP 'libtinfo5_[0-9][^"]*_amd64\.deb' \
            | sort -V | tail -n1)
          if [ -z "$LIBTINFO5_DEB" ]; then
            echo "✘ Could not find a libtinfo5 amd64 build in ${NCURSES_POOL}"
            exit 1
          fi
          curl -fL -o "/tmp/libtinfo5/${LIBTINFO5_DEB}" "${NCURSES_POOL}/${LIBTINFO5_DEB}" || exit 1
          sudo apt install -y "/tmp/libtinfo5/${LIBTINFO5_DEB}" || exit 1
          rm -rf /tmp/libtinfo5

      - name: Derive toolchain names from URLs
        run: |
          NEUTRON_CLANG_NAME=$(basename "${NEUTRON_CLANG_URL}")
          NEUTRON_CLANG_NAME="${NEUTRON_CLANG_NAME%.tar.zst}"
          echo "NEUTRON_CLANG_NAME=${NEUTRON_CLANG_NAME}" >> $GITHUB_ENV
          echo "TC_DIR=${RUNNER_TEMP}/toolchains" >> $GITHUB_ENV

      - name: Cache toolchains
        id: cache-toolchains
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TC_DIR }}/${{ env.NEUTRON_CLANG_NAME }}
          key: toolchains-${{ env.NEUTRON_CLANG_NAME }}-aarch64
    
      - name: Download toolchains (on cache miss)
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${TC_DIR}/${NEUTRON_CLANG_NAME}"
          curl -L -o /tmp/neutron-clang.tar.zst "${NEUTRON_CLANG_URL}" || exit 1
          tar -xf /tmp/neutron-clang.tar.zst -C "${TC_DIR}/${NEUTRON_CLANG_NAME}" || exit 1
          rm /tmp/neutron-clang.tar.zst
        
      - name: Save toolchains cache
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TC_DIR }}/${{ env.NEUTRON_CLANG_NAME }}
          key: toolchains-${{ env.NEUTRON_CLANG_NAME }}-aarch64
      
      - name: Update Submodules
        run: |
          git submodule sync --recursive
          if [ "${{ github.event.inputs.latest_submodules }}" = "true" ]; then
            echo "Fetching latest submodule commits (--remote)"
            git submodule update --init --recursive --remote
          else
            echo "Fetching submodules pinned to recorded commits (detached HEAD)"
            git submodule update --init --recursive
          fi

      - name: Build Kernel
        run: |
          mkdir -p "${RDIR}/out" "${RDIR}/build"
          
          export PATH="${TC_DIR}/${NEUTRON_CLANG_NAME}/bin:$PATH"
          export ARGS="-C ${RDIR} O=${RDIR}/out -j$(nproc) ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y"
          
          start_time=$(date +%s)
          make ${ARGS} a04e_defconfig custom.config droidspaces.config
          make ${ARGS} || exit 1
          elapsed_time=$(d=$(( $(date +%s) - start_time )); printf "%02d:%02d:%02d" $((d/3600)) $((d%3600/60)) $((d%60)))
          echo "BUILDTIME=${elapsed_time}" >> $GITHUB_ENV

      - name: Package with AnyKernel3
        run: |
          VERSION=$(grep -E "^VERSION =" Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep -E "^PATCHLEVEL =" Makefile | awk '{print $3}')
          SUBLEVEL=$(grep -E "^SUBLEVEL =" Makefile | awk '{print $3}')
          LOCALVERSION=$(grep "CONFIG_LOCALVERSION=" "out/.config" | cut -d'"' -f2)
          KVERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}${LOCALVERSION}"
          
          KSUVAR=$(basename "$(git -C "$(dirname "$(realpath "${RDIR}/drivers/kernelsu")")" config --get remote.origin.url)" | sed 's/\.git$//')
          KSUVER="($(sed -n 's/.*-DKSU_VERSION=//p' "${RDIR}/drivers/kernelsu/Makefile" | tr -d '\r ' | xargs))"
          
          IMGDIR="${RDIR}/out/arch/arm64/boot"
          IMGFILE="${IMGDIR}/Image"
          AK3_DIR="${IMGDIR}/AnyKernel3"
          AK3_NAME="AnyKernel3-${KVERSION}-${KSUVAR}${KSUVER}"
          AK3_FILE="${AK3_DIR}/${AK3_NAME}.zip"

          git clone --depth=1 https://github.com/N4hom-37/AnyKernel3.git "${AK3_DIR}"
          cp "${IMGFILE}" "${AK3_DIR}/Image"
          (cd "${AK3_DIR}" && zip -r9 "${AK3_NAME}.zip" ./* -x ".*" "*/.*")

          echo "KVERSION=${KVERSION}" >> $GITHUB_ENV
          echo "AK3_DIR=${AK3_DIR}" >> $GITHUB_ENV
          echo "AK3_NAME=${AK3_NAME}" >> $GITHUB_ENV
          echo "AK3_FILE=${AK3_FILE}" >> $GITHUB_ENV
          echo "KSUVAR=${KSUVAR}" >> $GITHUB_ENV
          echo "KSUVER=${KSUVER}" >> $GITHUB_ENV

      - name: Upload Artifact
        if: github.event.inputs.publish_release != 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.AK3_NAME }}
          path: |
            ${{ env.AK3_DIR }}/**
            !${{ env.AK3_DIR }}/**/.*
            !${{ env.AK3_DIR }}/**/.*/**
            !${{ env.AK3_DIR }}/AnyKernel3*.zip
          compression-level: 9

      - name: Publish to GitHub Release
        if: github.event.inputs.publish_release == 'true'
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          ZIP_FILE="${AK3_FILE}"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "✘ Release: Zip file not found at $ZIP_FILE"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP_FILE" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$ZIP_FILE" \
              --repo "${{ github.repository }}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Send to Telegram
        continue-on-error: true
        if: env.BOT_TOKEN != '' && env.CHAT_ID != ''
        run: |
          ZIP_FILE="${AK3_FILE}"
          if [ -z "$ZIP_FILE" ]; then
            echo "✘ Telegram: Zip file not found"
            exit 1
          fi

          DESC=$(printf '%s\n' \
              "🛠️ New Kernel Build" \
              "      ‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾" \
              ". 📱 Device: Galaxy A04e" \
              ". 📦 Version: ${KVERSION}" \
              ". 🌿 Branch: ${GITHUB_REF_NAME:-${{ github.run_number }}}" \
              ". ☯️ Ksu: ${KSUVAR} ${KSUVER}" \
              ". 👤 Author: ${KBUILD_BUILD_USER}" \
              ". 🕒 Build time: ${BUILDTIME}" \
              ". 🔧 Toolchain: Neutron clang" \
              ". 📅 Date: $(date +"%Y-%m-%d %I:%M:%S %p")"
          )

          if curl -s -f -F document=@"$ZIP_FILE" -F caption="$DESC" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendDocument?chat_id=$CHAT_ID" > /dev/null; then
            echo "✔ Telegram: Sent successfully."
          else
            echo "✘ Telegram: Failed to send."
          fi
